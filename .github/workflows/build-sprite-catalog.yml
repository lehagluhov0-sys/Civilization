name: Build diagnostic sprite catalog v4

on:
  push:
    branches: [main]
    paths:
      - "tools/sprite_catalog/**"
      - ".github/workflows/build-sprite-catalog.yml"
      - "assets/sprites/*.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scipy

      - name: Build coordinate catalog and contact sheets
        run: python tools/sprite_catalog/build_catalog.py

      - name: Commit catalog outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites/catalog/
          git status --short
          if git diff --cached --quiet; then
            echo "Catalog outputs are already up to date."
          else
            git commit -m "Generate diagnostic sprite atlas catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload contact sheets for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: sprite-contact-sheets
          path: |
            assets/sprites/catalog/*.png
            assets/sprites/*.png
          if-no-files-found: error
