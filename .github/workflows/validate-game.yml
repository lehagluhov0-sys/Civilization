name: Validate game scripts and sprite mappings

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**/*.js"
      - "assets/sprites/catalog/*.json"
      - "assets/sprites/*.png"
      - ".github/workflows/validate-game.yml"
  pull_request:
    paths:
      - "index.html"
      - "js/**/*.js"
      - "assets/sprites/catalog/*.json"
      - "assets/sprites/*.png"
      - ".github/workflows/validate-game.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          set -e
          find js -type f -name "*.js" -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Validate sprite catalog references and coordinates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          atlas = json.loads((root / "assets/sprites/catalog/atlas_catalog.json").read_text())
          mapping = json.loads((root / "assets/sprites/catalog/runtime-mapping.json").read_text())
          candidates = atlas.get("candidates", atlas if isinstance(atlas, list) else [])
          ids = {item.get("id") for item in candidates if isinstance(item, dict)}
          entries = mapping.get("sprites", mapping.get("entries", {}))
          if isinstance(entries, list):
              entries = {item.get("key"): item for item in entries}
          missing = []
          for key, item in entries.items():
              candidate = item.get("candidate_id") or item.get("candidateId")
              if candidate and candidate not in ids:
                  missing.append((key, candidate))
          if missing:
              raise SystemExit(f"Missing sprite candidates: {missing[:10]}")
          print(f"Validated {len(entries)} runtime sprite mappings.")
          PY
